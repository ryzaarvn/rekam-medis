<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi - E-REKAM MEDIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>
    <div class="auth-container">
        <!-- Banner Bagian Kiri -->
        <div class="auth-banner">
            <div class="auth-banner-content">
                <h1>Mengamankan data medis, memberdayakan pasien.</h1>
                <p>Sistem Rekam Medis Elektronik berbasis Blockchain.</p>
            </div>
        </div>

        <!-- Panel Form Kanan -->
        <div class="auth-panel">
            <div class="auth-panel-body py-4">
                <div class="text-center mb-3">
                    <i class="bi bi-person-plus-fill text-info fs-1"></i>
                    <h4 class="fw-bold mt-2 mb-1">DAFTARKAN AKUN BARU</h4>
                    <p class="text-muted small">Daftarkan Peran & Selesaikan Akun</p>
                </div>

                <div id="reg-alert" class="alert d-none py-2 fs-7" role="alert"></div>

                <form id="publicRegisterForm">
                    <div class="mb-2">
                        <label class="form-label">Daftar Sebagai (Role)</label>
                        <select name="role" class="form-select form-control-dark">
                            <option value="pasien">Pasien</option>
                            <option value="dokter">Dokter</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Nama Lengkap</label>
                        <input type="text" name="nama_lengkap" class="form-control form-control-dark"
                            placeholder="Nama Lengkap">
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control form-control-dark"
                            placeholder="Username unik">
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control form-control-dark"
                            placeholder="Password">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Alamat Wallet Ethereum (Hardhat)</label>
                        <input type="text" name="wallet_address" class="form-control form-control-dark"
                            placeholder="0x7099...79C8">
                    </div>
                    <button type="submit" class="btn btn-primary btn-auth w-100 text-white mb-2">Selesaikan
                        Pendaftaran</button>
                </form>

                <div class="text-center mt-2">
                    <span class="text-muted small">Sudah punya akun? <a href="login.html" class="auth-link">Masuk di
                            sini</a></span>
                </div>
            </div>

            <!-- Footer Panel Kanan -->
            <footer class="auth-footer">
                Tentang • Bantuan • Privasi • Syarat & Ketentuan • 2026 E-Rekam Medis
            </footer>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/main.js"></script>
</body>

</html>
