<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - E-REKAM MEDIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>
    <div class="auth-container">
        <!-- Banner Bagian Kiri -->
        <div class="auth-banner">
            <div class="auth-banner-content">
                <h1>Mengamankan data medis, memberdayakan pasien.</h1>
                <p>Sistem Rekam Medis Elektronik berbasis Blockchain.</p>
            </div>
        </div>

        <!-- Panel Form Kanan -->
        <div class="auth-panel">
            <div class="auth-panel-body">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock-fill text-info fs-1"></i>
                    <h3 class="fw-bold mt-2 mb-1">E-REKAM MEDIS</h3>
                    <p class="text-muted small">Akses Sistem melalui Akun Anda</p>
                </div>

                <div id="login-alert" class="alert alert-danger d-none py-2 fs-7" role="alert">
                    Username/password salah
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control form-control-dark"
                            placeholder="Masukkan username">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control form-control-dark"
                            placeholder="Masukkan password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-auth w-100 text-white mb-3">Masuk ke
                        Dashboard</button>
                </form>

                <div class="text-center mt-3">
                    <span class="text-muted small">Belum punya akun? <a href="register.html" class="auth-link">Daftar di
                            sini</a></span>
                </div>
            </div>

            <!-- Footer Panel Kanan -->
            <footer class="auth-footer">
                Tentang • Bantuan • Privasi • Syarat & Ketentuan • 2026 E-Rekam Medis
            </footer>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/main.js"></script>
</body>

</html>
