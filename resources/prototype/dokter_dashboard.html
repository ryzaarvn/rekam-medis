<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dokter - Sistem Rekam Medis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        /* Penyesuaian khusus agar lebih ramah dibaca dokter senior */
        .elder-form .form-label {
            font-size: 1rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .elder-form .form-control,
        .elder-form .form-select {
            font-size: 1rem;
            padding: 12px 14px;
            border: 1.5px solid #94a3b8;
            border-radius: 8px;
        }

        .elder-form .form-control:focus,
        .elder-form .form-select:focus {
            border-color: #0f766e;
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
        }

        .quick-chip {
            cursor: pointer;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #334155;
            transition: all 0.15s;
        }

        .quick-chip:hover {
            background: #0f766e;
            color: #ffffff;
            border-color: #0f766e;
        }
    </style>
</head>

<body>
    <div class="app-wrapper">
        <!-- Sidebar Kiri -->
        <aside class="sidebar">
            <div class="sidebar-brand">E-REKAM MEDIS</div>
            <ul class="sidebar-menu">
                <li><a href="#" class="active"><i class="bi bi-file-earmark-medical"></i> Catat Pemeriksaan</a></li>
                <li><a href="login.html"><i class="bi bi-box-arrow-left"></i> Keluar</a></li>
            </ul>
        </aside>

        <!-- Area Kanan -->
        <div class="main-panel">
            <header class="topbar">
                <div><i class="bi bi-list fs-5"></i></div>
                <div class="fw-semibold"><i class="bi bi-person-circle me-1"></i> Dr. Andi Wijaya</div>
            </header>

            <main class="content-area">
                <!-- Lebar dibatasi agar tidak melebar berlebihan & lebih fokus -->
                <div style="max-width: 780px; margin: 0 auto;">
                    <div id="dokter-alert" class="alert fs-6 d-none" role="alert"></div>

                    <div class="page-header">
                        <h1 class="page-title"><i class="bi bi-file-earmark-medical"></i> Catatan Pemeriksaan Pasien
                        </h1>
                    </div>

                    <div class="panel-card p-4 elder-form">
                        <form id="medicalRecordForm">
                            <!-- Baris 1: Pasien & Tanggal -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-7">
                                    <label class="form-label"><i class="bi bi-person me-1 text-success"></i> Nama
                                        Pasien</label>
                                    <select name="patient_id" class="form-select">
                                        <option value="">-- Pilih Nama Pasien --</option>
                                        <option value="PAT001">Budi Santoso (PAT001)</option>
                                        <option value="PAT002">Siti Aminah (PAT002)</option>
                                    </select>
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label"><i class="bi bi-calendar-event me-1 text-success"></i>
                                        Tanggal Periksa</label>
                                    <input type="date" name="date" id="tglPeriksa" class="form-control">
                                </div>
                            </div>

                            <!-- Baris 2: Keluhan + Pilihan Cepat -->
                            <div class="mb-3">
                                <label class="form-label"><i class="bi bi-chat-left-text me-1 text-success"></i> Keluhan
                                    Pasien</label>
                                <div class="d-flex flex-wrap gap-2 mb-2">
                                    <span class="quick-chip" onclick="isiCepat('complaint', 'Demam dan sakit kepala')">+
                                        Demam & sakit kepala</span>
                                    <span class="quick-chip" onclick="isiCepat('complaint', 'Batuk dan pilek')">+ Batuk
                                        & pilek</span>
                                    <span class="quick-chip" onclick="isiCepat('complaint', 'Nyeri lambung / mual')">+
                                        Nyeri lambung</span>
                                </div>
                                <input type="text" name="complaint" id="complaint" class="form-control"
                                    placeholder="Tulis keluhan pasien...">
                            </div>

                            <!-- Baris 3: Diagnosis -->
                            <div class="mb-3">
                                <label class="form-label"><i class="bi bi-clipboard2-pulse me-1 text-success"></i> Hasil
                                    Diagnosis</label>
                                <input type="text" name="diagnosis" id="diagnosis" class="form-control"
                                    placeholder="Tulis hasil diagnosis dokter...">
                            </div>

                            <!-- Baris 4: Tindakan & Resep -->
                            <div class="mb-3">
                                <label class="form-label"><i class="bi bi-capsule me-1 text-success"></i> Tindakan &
                                    Obat</label>
                                <input type="text" name="treatment" id="treatment" class="form-control"
                                    placeholder="Tulis tindakan atau obat yang diberikan...">
                            </div>

                            <!-- Baris 5: Pesan / Catatan Tambahan -->
                            <div class="mb-4">
                                <label class="form-label"><i class="bi bi-pencil me-1 text-success"></i> Pesan untuk
                                    Pasien</label>
                                <textarea name="notes" id="notes" class="form-control" rows="2"
                                    placeholder="Contoh: Istirahat cukup dan kontrol 3 hari lagi"></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold py-3">
                                <i class="bi bi-check-circle-fill me-2"></i> Simpan Rekam Medis
                            </button>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/main.js"></script>
    <script>
        // Otomatis isi tanggal hari ini agar dokter tidak perlu repot memilih tanggal
        document.getElementById('tglPeriksa').valueAsDate = new Date();

        // Fungsi klik cepat untuk mengisi keluhan umum
        function isiCepat(fieldId, teks) {
            document.getElementById(fieldId).value = teks;
        }
    </script>
</body>

</html>
